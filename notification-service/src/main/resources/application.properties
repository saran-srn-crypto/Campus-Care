server.port=8083
spring.application.name=notification-service

# Oracle Database Configuration (SQL credentials sharing)
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:XE
spring.datasource.username=campuscare
spring.datasource.password=admin
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MongoDB Configuration (NoSQL Notifications Collection)
spring.data.mongodb.uri=mongodb://localhost:27017/campus_care

# Eureka Client Discovery configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

# JWT Configuration (for securing notification routes)
campuscare.jwt.secret=9a67471ec639e248b61c36081512db485c2c77d465d3a5a40a5996cc5c290a6e
campuscare.jwt.expiration-ms=86400000

# Swagger UI properties
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
