server.port=8080
spring.application.name=api-gateway

# Eureka Service Discovery configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Gateway Routing Rules
# Route for User Authentication Service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Route for Admin User Management (routed to auth-service)
spring.cloud.gateway.routes[1].id=auth-service-admin-users
spring.cloud.gateway.routes[1].uri=lb://auth-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/admin/users/**

# Route for Tickets Service
spring.cloud.gateway.routes[2].id=ticket-service
spring.cloud.gateway.routes[2].uri=lb://ticket-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/tickets/**

# Route for Administrative Ticket / Category Operations (routed to ticket-service)
spring.cloud.gateway.routes[3].id=ticket-service-admin
spring.cloud.gateway.routes[3].uri=lb://ticket-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/admin/**

# Route for Notification Service
spring.cloud.gateway.routes[4].id=notification-service
spring.cloud.gateway.routes[4].uri=lb://notification-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/notifications/**

# Route for Student Complaint History APIs
spring.cloud.gateway.routes[5].id=ticket-service-student-complaints
spring.cloud.gateway.routes[5].uri=lb://ticket-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/student/complaints,/api/student/complaints/**

# Global CORS configurations
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Methods Access-Control-Allow-Headers, RETAIN_FIRST

# Support large base64 image uploads and large Excel database uploads
spring.codec.max-in-memory-size=50MB

